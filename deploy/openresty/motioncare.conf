resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $motioncare_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name mcare.whestsun.com mcare-api.whestsun.com mcare-wx.whestsun.com;

    set $motioncare_acme http://motioncare-acme:8080;

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass $motioncare_acme;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mcare.whestsun.com;

    ssl_certificate /etc/nginx/conf.d/motioncare-cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/conf.d/motioncare-cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 80m;

    set $motioncare_api http://motioncare-api:8000;
    set $motioncare_web http://motioncare-web:80;

    location /api/ {
        proxy_pass $motioncare_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $motioncare_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass $motioncare_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

