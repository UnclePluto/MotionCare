[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-mcare"
version = "0.1.0"
description = "Independent serial motion-analysis worker for MotionCare"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "motion-analysis-contract==0.1.0",
  "psutil>=6,<8",
  "qiniu>=7.17,<8",
]

[project.optional-dependencies]
inference = [
  "opencv-contrib-python-headless==4.10.0.84",
  "paddlepaddle==3.3.0",
  "paddlex==3.7.2",
]
dev = [
  "pytest>=8,<9",
  "ruff==0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
