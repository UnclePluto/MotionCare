name: 部署生产环境

on:
  push:
    branches: [main]
    tags: ["deploy-*"]
  workflow_dispatch:

concurrency:
  group: motioncare-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  ACR_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/motioncare

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: motioncare
          POSTGRES_USER: motioncare
          POSTGRES_PASSWORD: motioncare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motioncare -d motioncare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装后端依赖
        run: pip install -e './backend[dev]'
      - name: 验证后端
        working-directory: backend
        env:
          DATABASE_URL: postgresql://motioncare:motioncare@127.0.0.1:5432/motioncare
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          pytest -q
          ruff check .
          python manage.py makemigrations --check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            miniapp/package-lock.json
      - name: 验证管理端
        working-directory: frontend
        run: |
          npm ci
          npm run test -- --maxWorkers=2 --minWorkers=2
          npm run lint
          npm run build
      - name: 验证患者端
        working-directory: miniapp
        run: |
          npm ci
          npm run test
          npm run build:h5

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_IMAGE }}:backend-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: 构建并推送管理端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_IMAGE }}:web-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: 构建并推送患者 H5 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: miniapp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_IMAGE }}:wx-${{ github.sha }}
          build-args: TARO_APP_API_BASE_URL=/api
          cache-from: type=gha,scope=wx
          cache-to: type=gha,mode=max,scope=wx
      - name: 镜像 PostgreSQL 和 Redis
        run: |
          docker pull --platform linux/amd64 postgres:16
          docker tag postgres:16 "${ACR_IMAGE}:postgres-16"
          docker push "${ACR_IMAGE}:postgres-16"
          docker pull --platform linux/amd64 redis:7
          docker tag redis:7 "${ACR_IMAGE}:redis-7"
          docker push "${ACR_IMAGE}:redis-7"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置 SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/motioncare_deploy
          chmod 600 ~/.ssh/motioncare_deploy
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: 上传部署配置
        run: |
          scp -i ~/.ssh/motioncare_deploy -P "${{ vars.SERVER_PORT }}" \
            deploy/docker-compose.prod.yml deploy/deploy.sh deploy/renew-certificate.sh \
            "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:/opt/motioncare-prod/"
      - name: 部署指定版本
        run: |
          ssh -i ~/.ssh/motioncare_deploy -p "${{ vars.SERVER_PORT }}" \
            "${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}" \
            "cd /opt/motioncare-prod && sed -i 's/^APP_VERSION=.*/APP_VERSION=${{ github.sha }}/' .env && chmod +x deploy.sh && ./deploy.sh"
